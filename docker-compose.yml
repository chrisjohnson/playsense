# ============================================================================
# Spotify Tracker - docker-compose (reference)
#
#   docker compose up --build
#   then open https://local-ai-machine.local:6111 (self-signed cert; trust once)
#
# NOTE: this deployment is actually run with standalone docker commands (no
# compose in this environment). This file documents the equivalent topology.
#
# Traffic chain:
#   browser -> caddy (HTTPS :6111) -> frontend (nginx :80) -> api (:8000)
#
# Only caddy is exposed to the host (port 6111). The frontend and api are
# reached by container name on the shared network - no other host ports.
#
# Spotify credentials are NOT in env vars. They are stored in a file under the
# bind-mounted host dir ~/.spotify-tracker (mounted at /spotify-tracker) and set
# through the web UI (POST /api/spotify/credentials).
# ============================================================================
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy run --config /etc/caddy.d/Caddyfile
    volumes:
      - ./docker/caddy:/etc/caddy.d:ro
      - ./certs:/etc/certs:ro
    ports:
      - "6111:6111"
    depends_on:
      - frontend
    networks:
      - sp-tracker-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: spotify-tracker:backend
    restart: unless-stopped
    networks:
      - sp-tracker-net
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/data
      - /home/chris/.spotify-tracker:/spotify-tracker
    environment:
      DATABASE_URL: sqlite:////data/spotify_tracker.db
      WORKER_CONCURRENCY: "4"
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: spotify-tracker:frontend
    restart: unless-stopped
    networks:
      - sp-tracker-net
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - api

networks:
  sp-tracker-net:
